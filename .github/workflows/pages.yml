name: Deploy project site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Explain one-time Pages setup
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=GitHub Pages not enabled::Open repository Settings > Pages and choose GitHub Actions as the Build and deployment source. The docs site will deploy automatically on a later push."

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
